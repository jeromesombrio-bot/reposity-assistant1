<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayanihan College - Enrollment Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 375px; background: #fff; display: flex; flex-direction: column; height: 100%; border-left: 1px solid #ccc; border-right: 1px solid #ccc; }
    .header { background: #003366; color: white; padding: 15px; text-align: center; font-weight: bold; }
    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .user-msg { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot-msg { background: #e4e6eb; color: #050505; align-self: flex-start; border-bottom-left-radius: 2px; }
    .meta { font-size: 11px; color: #65676b; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }
    .feedback-btns { display: flex; gap: 6px; }
    .feedback-btns button { background: none; border: none; cursor: pointer; font-size: 14px; }
    .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background: #fafafa; }
    .input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; }
    .input-area button { margin-left: 8px; padding: 10px 16px; background: #003366; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .loading { font-style: italic; color: #888; font-size: 12px; align-self: flex-start; display: none; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">Bayanihan College Helpdesk</div>
    <div class="chat-box" id="chatBox">
      <div class="msg bot-msg">Mabuhay! I am your Bayanihan College enrollment assistant. How can I help you today?</div>
    </div>
    <div class="loading" id="loading">Assistant is typing...</div>
    <div class="input-area">
      <input type="text" id="userMsg" placeholder="Ask about enrollment..." maxlength="500" onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userMsg");
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, "user-msg");
      input.value = "";
      document.getElementById("loading").style.display = "block";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        document.getElementById("loading").style.display = "none";

        if (res.ok) {
          appendBotMsg(data.answer, data.faq_ids, data.category, data.log_index);
        } else {
          appendMsg("Error: " + (data.error || "Unable to fetch response"), "bot-msg");
        }
      } catch (e) {
        document.getElementById("loading").style.display = "none";
        appendMsg("Network error. Please try again.", "bot-msg");
      }
    }

    function appendMsg(text, cls) {
      const box = document.getElementById("chatBox");
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function appendBotMsg(text, faqIds, category, logIndex) {
      const box = document.getElementById("chatBox");
      const div = document.createElement("div");
      div.className = "msg bot-msg";
      
      const idsText = faqIds.length > 0 ? `FAQ Sources: [${faqIds.join(", ")}]` : "FAQ Sources: None";
      const catText = category ? ` | Category: ${category}` : "";
      
      div.innerHTML = `
        <div>${text}</div>
        <div class="meta">
          <span>${idsText}${catText}</span>
          <div class="feedback-btns">
            <button onclick="rate(${logIndex}, 'up', this)">👍</button>
            <button onclick="rate(${logIndex}, 'down', this)">👎</button>
          </div>
        </div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function rate(logIndex, rating, btn) {
      await fetch("/api/rate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ log_index: logIndex, rating: rating })
      });
      const parent = btn.parentElement;
      parent.innerHTML = rating === 'up' ? "<b>👍 Rated</b>" : "<b>👎 Rated</b>";
    }
  </script>
</body>
</html>
