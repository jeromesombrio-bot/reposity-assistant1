<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayanihan College Helpdesk</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; background: white; display: flex; flex-direction: column; height: 100vh; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { background: #003366; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .bot { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .meta { font-size: 0.75rem; color: #666; margin-top: 5px; }
        .ratings { display: inline-block; margin-left: 8px; cursor: pointer; }
        .input-area { padding: 10px; border-top: 1px solid #ddd; display: flex; gap: 8px; background: white; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { background: #0084ff; color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">Bayanihan College Helpdesk</div>
        <div class="messages" id="chatBox">
            <div class="msg bot">Mabuhay! I am your Bayanihan College enrollment assistant. How can I help you today?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask a question..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            addMessage(text, 'user');
            input.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();
                
                let botText = data.answer;
                let metaText = `<div class="meta">FAQ Sources: [${data.sources ? data.sources.join(', ') : '1'}] | Category: ${data.category || 'general'} 
                    <span class="ratings"><span onclick="rate('up')">👍</span> <span onclick="rate('down')">👎</span></span></div>`;
                
                addMessage(botText + metaText, 'bot', true);
            } catch(e) {
                addMessage("I am here to help with your Bayanihan College enrollment questions!", 'bot');
            }
        }

        function addMessage(text, type, isHtml=false) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            if(isHtml) div.innerHTML = text;
            else div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function handleKey(e) {
            if(e.key === 'Enter') sendMessage();
        }

        async function rate(val) {
            await fetch('/api/rate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({rating: val})
            });
            alert('Thank you for your feedback!');
        }
    </script>
</body>
</html>
